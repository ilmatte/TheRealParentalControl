version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: parental-control-mongod
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: parental_control
    networks:
      - parental-control-network

  backend:
    build:
      context: ./backend
    container_name: parental-control-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/parental_control
      JWT_SECRET: your-super-secret-key-change-in-production
      JWT_EXPIRE: 7d
      CLIENT_URLS: http://localhost:3000,http://localhost:3001,exp://localhost:8081
    depends_on:
      - mongo
    networks:
      - parental-control-network
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

volumes:
  mongo-data:
    driver: local

networks:
  parental-control-network:
    driver: bridge
